name: Release

# Push a tag such as v0.1 or v1.2.3 to build the desktop app and publish a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release and upload its asset

jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag.TrimStart('v')
          # .NET wants at least major.minor.patch: v0.1 -> 0.1.0
          while ($version.Split('.').Count -lt 3) { $version += '.0' }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test --solution ApiPin.slnx --configuration Release

      - name: Publish desktop app (win-x64, self-contained)
        run: >
          dotnet publish src/ApiPin.Desktop
          --configuration Release
          --runtime win-x64
          --self-contained
          --output publish/ApiPin
          -p:Version=${{ steps.version.outputs.version }}
          -p:DebugType=none

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/ApiPin -DestinationPath "ApiPin-${{ steps.version.outputs.tag }}-win-x64.zip"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $notes = @"
          ApiPin desktop app for Windows (x64), self-contained: no .NET install needed.

          **Install:** download ``ApiPin-$tag-win-x64.zip``, unzip it anywhere and run ``ApiPin\ApiPin.exe``.

          **Requirements:** Windows 10 1809 or later, and the WebView2 runtime (already part of Windows 11).

          The app isn't code-signed yet, so Windows SmartScreen may warn the first time you run it.
          "@
          gh release create $tag "ApiPin-$tag-win-x64.zip" --title "ApiPin $tag" --notes $notes --generate-notes --verify-tag
